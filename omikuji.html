            {
                id: 3,

                category: "子ども・教育",
                org: "キッズITラボ",
                orgRating: 4.7,
                orgReviewCount: 12,
                reviews: [
                    { name: "ヤマダ", rating: 5, date: "1ヶ月前", comment: "子供たちの無邪気な笑顔に元気をもらえました！説明もとても丁寧です。" }
                ],
                date: "今週土曜 13:00〜15:30",

                current: 5,
                capacity: 5,
                rewardPts: 120,
                isQuick: false,
                tags: ["未経験OK", "お一人様大歓迎", "証明書あり"],
                img: "https://images.unsplash.com/photo-1485546246426-74dc88dec4d9?w=600&auto=format&fit=crop&q=80",

                belongings: "筆記用具",

            },
            {

                title: "フードバンクの常温食品の仕分け＆箱詰めの作業",
                category: "福祉・高齢者",
                org: "東京フードリンク",
                orgRating: 4.9,
                orgReviewCount: 42,
                reviews: [
                    { name: "スズキ", rating: 5, date: "5日前", comment: "社会貢献を実感できる素晴らしい体験でした。テキパキ進行して気持ち良いです。" }
                ],
                date: "今週日曜 11:00〜13:00",
                location: "東京都品川区 大崎",
                current: 8,
                capacity: 10,
                rewardPts: 80,
                isQuick: true,
                tags: ["未経験OK", "手ぶらOK", "証明書あり"],
                img: "https://images.unsplash.com/photo-1593113598332-cd288d649433?w=600&auto=format&fit=crop&q=80",
                desc: "企業や家庭から寄付された缶詰やレトルト食品の賞味期限をチェックし、配送用ダンボールへ仕分けしていく簡単な作業です。コツコツ作業が好きな方にピッタリです。",
                belongings: "室内履きスニーカー",
                pinCoords: { top: '75%', left: '55%' }
            },
            {
                id: 5,
                title: "地域夏祭り・手作りマルシェの受付＆案内スタッフ",
                category: "イベントスタッフ",
                org: "下町まちづくり実行委員会",
                orgRating: 4.6,
                orgReviewCount: 19,
                reviews: [
                    { name: "アオキ", rating: 4, date: "3週間前", comment: "スタッフの皆さんが元気で活気がありました！" }
                ],
                date: "来週土曜 10:00〜14:00",
                location: "東京都台東区 浅草",
                current: 3,
                capacity: 6,
                rewardPts: 150,
                isQuick: false,
                tags: ["未経験OK", "お一人様大歓迎"],
                img: "https://images.unsplash.com/photo-1531058020387-3be344556be6?w=600&auto=format&fit=crop&q=80",
                desc: "地元商店街で開催されるマルシェイベントでのパンフレット配布、案内係、会場清掃のサポートです。お祭りの賑やかな雰囲気を楽しみながらボランティアができます！",
                belongings: "帽子、タオル、水分",
                pinCoords: { top: '20%', left: '75%' }
            }
        ];

        let activities = JSON.parse(localStorage.getItem('volun_activities')) || defaultActivities;
        let joinedActivityIds = JSON.parse(localStorage.getItem('volun_joined')) || [1];
        let userPoints = parseInt(localStorage.getItem('volun_points')) || 350;
        let currentInputRating = 5;
        let activeModalId = null;

        function saveStateToStorage() {
            localStorage.setItem('volun_activities', JSON.stringify(activities));
            localStorage.setItem('volun_joined', JSON.stringify(joinedActivityIds));
            localStorage.setItem('volun_points', userPoints.toString());
        }

        window.onload = function() {
            renderFeed(activities);
            renderMapPins(activities);
            renderJoinedList();
        };

        // Render Cards with Star Ratings
        function renderFeed(items) {
            const container = document.getElementById('cards-container');
            document.getElementById('result-count').textContent = `${items.length}件`;

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center text-gray-500 bg-white rounded-2xl border border-dashed border-gray-300">
                        <i class="fa-solid fa-folder-open text-3xl text-gray-300 mb-2"></i>
                        <p class="font-bold">条件に一致するボランティアが見つかりませんでした</p>
                        <p class="text-xs text-gray-400 mt-1">フィルターを変更して再度検索してみてください</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(act => {
                const isJoined = joinedActivityIds.includes(act.id);
                const isFull = act.current >= act.capacity && !isJoined;

                return `
                <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between">
                    <div>
                        <!-- Image & Badges Header -->
                        <div class="relative h-40 w-full overflow-hidden bg-gray-100">
                            <img src="${act.img}" alt="${act.title}" class="w-full h-full object-cover transition transform hover:scale-105 duration-300">
                            <div class="absolute top-3 left-3 flex gap-1.5 flex-wrap">
                                <span class="bg-emerald-600/90 backdrop-blur-sm text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow">
                                    ${act.category}
                                </span>
                                ${act.isQuick ? `<span class="bg-amber-500/90 backdrop-blur-sm text-white text-[10px] font-bold px-2 py-1 rounded-full shadow">⚡️ 短時間</span>` : ''}
                            </div>
                            <div class="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white text-xs px-2.5 py-0.5 rounded-md font-semibold">
                                +${act.rewardPts} pt
                            </div>
                        </div>

                        <!-- Content Body -->
                        <div class="p-4 space-y-2">
                            <div class="flex items-center justify-between text-xs text-gray-500">
                                <span class="font-semibold text-emerald-700 truncate">${act.org}</span>
                                <div class="flex items-center gap-1 text-amber-500 font-bold shrink-0">
                                    <i class="fa-solid fa-star text-[11px]"></i>
                                    <span>${act.orgRating}</span>
                                    <span class="text-gray-400 font-normal text-[10px]">(${act.orgReviewCount})</span>
                                </div>
                            </div>

                            <h3 class="font-bold text-gray-900 text-sm leading-snug line-clamp-2 hover:text-emerald-600 cursor-pointer" onclick="openDetailModal(${act.id})">
                                ${act.title}
                            </h3>
                            
                            <div class="space-y-1 text-xs text-gray-600 pt-1">
                                <div class="flex items-center gap-2">
                                    <i class="fa-regular fa-clock w-4 text-emerald-600"></i>
                                    <span>${act.date}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <i class="fa-solid fa-location-dot w-4 text-emerald-600"></i>
                                    <span class="truncate">${act.location}</span>
                                </div>
                            </div>

                            <!-- Tags -->
                            <div class="flex gap-1 flex-wrap pt-2">
                                ${act.tags.map(t => `<span class="bg-slate-100 text-slate-600 text-[10px] font-medium px-2 py-0.5 rounded">#${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Footer Action -->
                    <div class="px-4 py-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                        <div class="text-xs">
                            <span class="text-gray-400">定員:</span>
                            <span class="font-bold ${isFull ? 'text-red-500' : 'text-emerald-700'}">${act.current}/${act.capacity}人</span>
                        </div>
                        <button onclick="openDetailModal(${act.id})" class="text-xs font-bold ${isJoined ? 'bg-amber-100 text-amber-800' : isFull ? 'bg-gray-200 text-gray-500 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} px-4 py-2 rounded-xl transition">
                            ${isJoined ? '✓ 参加受付済' : isFull ? 'キャンセル待ち' : '詳細・参加'}
                        </button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // Render Pins for Map View
        function renderMapPins(items) {
            const container = document.getElementById('map-pins-container');
            container.innerHTML = items.map(act => `
                <div style="top: ${act.pinCoords.top}; left: ${act.pinCoords.left};" 
                     onclick="openDetailModal(${act.id})" 
                     class="absolute transform -translate-x-1/2 -translate-y-1/2 group cursor-pointer">
                    <div class="bg-emerald-600 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg border-2 border-white flex items-center gap-1 group-hover:bg-emerald-700 group-hover:scale-110 transition">
                        <i class="fa-solid fa-hand-holding-heart"></i>
                        <span class="hidden sm:inline">${act.category}</span>
                    </div>
                </div>
            `).join('');
        }

        // Render Joined Items in MyPage
        function renderJoinedList() {
            const container = document.getElementById('joined-list');
            const joinedList = activities.filter(a => joinedActivityIds.includes(a.id));

            if (joinedList.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">現在参加予定のボランティアはありません</p>`;
                return;
            }

            container.innerHTML = joinedList.map(act => `
                <div class="border border-emerald-100 bg-emerald-50/40 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <div class="space-y-1">
                        <span class="bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">参加確定</span>
                        <h4 class="font-bold text-sm text-gray-900">${act.title}</h4>
                        <p class="text-xs text-gray-600"><i class="fa-regular fa-clock"></i> ${act.date} | ${act.location}</p>
                    </div>
                    <button onclick="openDetailModal(${act.id})" class="text-xs bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold px-3 py-1.5 rounded-lg whitespace-nowrap">
                        案内・連絡を見る
                    </button>
                </div>
            `).join('');
        }

        function handleSearch() {
            filterData();
        }

        function handleFilter() {
            filterData();
        }

        let selectedTag = null;
        function toggleTag(tagName) {
            if (selectedTag === tagName) {
                selectedTag = null;
                document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('bg-emerald-600', 'text-white'));
            } else {
                selectedTag = tagName;
                document.querySelectorAll('.tag-btn').forEach(btn => {
                    if (btn.textContent.includes(tagName)) {
                        btn.classList.add('bg-emerald-600', 'text-white');
                    } else {
                        btn.classList.remove('bg-emerald-600', 'text-white');
                    }
                });
            }
            filterData();
        }

        function filterQuickEvents() {
            document.getElementById('time-filter').value = 'quick';
            filterData();
            showToast("⚡️ 短時間で気軽に参加できる活動に絞り込みました");
        }

        function filterData() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            const timeFilter = document.getElementById('time-filter').value;

            const filtered = activities.filter(act => {
                const matchQuery = act.title.toLowerCase().includes(query) || act.location.toLowerCase().includes(query) || act.org.toLowerCase().includes(query);
                const matchCategory = category === 'all' || act.category === category;
                const matchTime = timeFilter === 'all' || (timeFilter === 'quick' && act.isQuick) || (timeFilter === 'today' && act.date.includes('本日'));
                const matchTag = !selectedTag || act.tags.includes(selectedTag);

                return matchQuery && matchCategory && matchTime && matchTag;
            });

            renderFeed(filtered);
        }

        // Open Modal with Detailed Reviews
        function openDetailModal(id) {
            const act = activities.find(a => a.id === id);
            if (!act) return;

            activeModalId = id;
            document.getElementById('modal-img').src = act.img;
            document.getElementById('modal-title').textContent = act.title;
            document.getElementById('modal-category').textContent = act.category;
            document.getElementById('modal-org').querySelector('span').textContent = act.org;
            
            document.getElementById('modal-org-rating-header').textContent = act.orgRating;
            document.getElementById('modal-org-reviews-count-header').textContent = `(${act.orgReviewCount})`;
            document.getElementById('modal-org-rating').textContent = act.orgRating;

            document.getElementById('modal-date').textContent = act.date;
            document.getElementById('modal-location').textContent = act.location;
            document.getElementById('modal-capacity').textContent = `${act.current} / ${act.capacity}人`;
            document.getElementById('modal-reward').textContent = `+${act.rewardPts} ボランティアpt`;
            document.getElementById('modal-desc').textContent = act.desc;
            document.getElementById('modal-belongings').textContent = act.belongings;

            // Render Reviews List
            const reviewsContainer = document.getElementById('modal-reviews-list');
            if (act.reviews && act.reviews.length > 0) {
                reviewsContainer.innerHTML = act.reviews.map(r => `
                    <div class="bg-white p-2.5 rounded-lg border border-amber-100 shadow-2xs space-y-1">
                        <div class="flex items-center justify-between text-[11px]">
                            <span class="font-bold text-gray-800">${r.name} さん</span>
                            <div class="flex items-center gap-1">
                                <span class="text-amber-500 font-bold">★ ${r.rating}.0</span>
                                <span class="text-gray-400 text-[10px]">${r.date}</span>
                            </div>
                        </div>
                        <p class="text-xs text-gray-600 leading-snug">${r.comment}</p>
                    </div>
                `).join('');
            } else {
                reviewsContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">まだ投稿された口コミはありません。</p>`;
            }

            document.getElementById('review-form').classList.add('hidden');

            const quickBadge = document.getElementById('modal-quick');
            if (act.isQuick) quickBadge.classList.remove('hidden');
            else quickBadge.classList.add('hidden');

            const applyBtn = document.getElementById('apply-btn');
            const isJoined = joinedActivityIds.includes(act.id);
            if (isJoined) {
                applyBtn.innerHTML = '<span>✓ 参加受付済み</span>';
                applyBtn.className = 'bg-amber-500 text-white font-bold px-6 py-3 rounded-xl shadow-md cursor-default text-sm';
            } else {
                applyBtn.innerHTML = '<span>ワンタップで参加応募</span><i class="fa-solid fa-arrow-right"></i>';
                applyBtn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-2 text-sm';
            }

            document.getElementById('detail-modal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function toggleReviewForm() {
            const form = document.getElementById('review-form');
            form.classList.toggle('hidden');
        }

        function setSelectRating(val) {
            currentInputRating = val;
            document.getElementById('selected-rating-val').textContent = `${val}.0`;
            const stars = document.querySelectorAll('#star-select-container .star-btn');
            stars.forEach((star, index) => {
                if (index < val) {
                    star.className = 'fa-solid fa-star star-btn text-amber-400';
                } else {
                    star.className = 'fa-regular fa-star star-btn text-gray-300';
                }
            });
        }

        function submitReview() {
            const textInput = document.getElementById('review-input-text');
            const text = textInput.value.trim();
            if (!text) {
                showToast("⚠️ 感想メッセージを入力してください");
                return;
            }

            const act = activities.find(a => a.id === activeModalId);
            if (act) {
                act.reviews.unshift({
                    name: "山田 花子",
                    rating: currentInputRating,
                    date: "たった今",
                    comment: text
                });
                act.orgReviewCount += 1;
                act.orgRating = parseFloat(((act.orgRating * (act.orgReviewCount - 1) + currentInputRating) / act.orgReviewCount).toFixed(1));

                textInput.value = '';
                saveStateToStorage();
                openDetailModal(activeModalId);
                renderFeed(activities);
                showToast("🌟 口コミを投稿しました！ありがとうございます。");
            }
        }

        function applyActivity() {
            if (!activeModalId) return;

            if (joinedActivityIds.includes(activeModalId)) {
                showToast("既にこのボランティアに参加申し込みしています");
                return;
            }

            joinedActivityIds.push(activeModalId);
            const act = activities.find(a => a.id === activeModalId);
            if (act) {
                act.current += 1;
                userPoints += act.rewardPts;
            }

            saveStateToStorage();
            document.getElementById('user-points').textContent = userPoints;
            document.getElementById('stat-pts').textContent = `${userPoints} pt`;
            document.getElementById('stat-count').textContent = `${7 + joinedActivityIds.length} 回`;

            closeDetailModal();
            renderFeed(activities);
            renderJoinedList();

            showToast(`🎉 「${act.title}」に応募完了しました！+${act.rewardPts}pt獲得`);
        }

        function openCreateModal() {
            document.getElementById('create-modal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.add('hidden');
        }

        function handleCreateSubmit(e) {
            e.preventDefault();
            const newActivity = {
                id: Date.now(),
                title: document.getElementById('form-title').value,
                category: document.getElementById('form-category').value,
                org: "個人 / あなたの投稿",
                orgRating: 5.0,
                orgReviewCount: 1,
                reviews: [
                    { name: "事務局", rating: 5, date: "本日", comment: "新規作成された募集です。" }
                ],
                date: document.getElementById('form-date').value,
                location: document.getElementById('form-location').value,
                current: 1,
                capacity: parseInt(document.getElementById('form-cap').value) || 5,
                rewardPts: 60,
                isQuick: true,
                tags: ["未経験OK", "主催者"],
                img: "https://images.unsplash.com/photo-1559027615-cd4628902d4a?w=600&auto=format&fit=crop&q=80",
                desc: document.getElementById('form-desc').value,
                belongings: document.getElementById('form-belongings').value || "特になし",
                pinCoords: { top: '50%', left: '50%' }
            };

            activities.unshift(newActivity);
            saveStateToStorage();
            closeCreateModal();
            renderFeed(activities);
            renderMapPins(activities);

            showToast("✨ ボランティア募集を公開しました！");
            switchTab('feed');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-view').forEach(view => view.classList.add('hidden'));
            document.getElementById(`view-${tabName}`).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-600', 'border-b-2', 'border-emerald-600', 'font-semibold');
                btn.classList.add('text-gray-600', 'font-medium');
            });
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeNav) {
                activeNav.classList.add('text-emerald-600', 'border-b-2', 'border-emerald-600', 'font-semibold');
            }

            const mobItems = ['feed', 'map', 'mypage'];
            mobItems.forEach(item => {
                const mobBtn = document.getElementById(`mob-nav-${item}`);
                if (mobBtn) {
                    if (item === tabName) {
                        mobBtn.classList.add('text-emerald-600', 'font-bold');
                        mobBtn.classList.remove('text-gray-500', 'font-medium');
                    } else {
                        mobBtn.classList.remove('text-emerald-600', 'font-bold');
                        mobBtn.classList.add('text-gray-500', 'font-medium');
                    }
                }
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        function downloadCertificate() {
            showToast("📄 ボランティア活動証明書(PDF)のダウンロードを開始しました");
        }
    </script>
</body>
</html>
